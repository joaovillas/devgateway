# Rota do serviço de pagamentos de brinquedo (examples/toys/payments).
# /payments/* chega ao upstream sem o prefixo: /payments/balance vira /balance.
# Os overrides casam com o path como o cliente enviou, antes do corte.
schemaVersion: 1
name: payments
upstream: http://127.0.0.1:9001
match:
  path: /payments/*
stripPrefix: true
rewriteHost: true
timeout: 5s
overrides:
  # Override forçado: sem probability, vale em toda requisição que casa.
  # Só pega quem envia X-Scenario: declined, o resto segue para o upstream.
  - name: charge-declined
    match:
      path: /payments/charges
      method: POST
      headers:
        X-Scenario: declined
    respond:
      status: 402
      headers:
        Content-Type: application/json
      body:
        error: card_declined
        message: Cartão recusado pelo emissor

  # Override probabilístico: 30% das consultas de saldo recebem 503 sintetizado.
  # Com seed fixa em gateway.json, a sequência se repete na mesma ordem de chegada.
  - name: balance-flaky
    match:
      path: /payments/balance
      method: GET
    probability: 0.3
    respond:
      status: 503
      headers:
        Content-Type: application/json
        Retry-After: "1"
      body:
        error: balance_unavailable

  # Latência em intervalo: a consulta de cobrança vai ao upstream, mas antes
  # espera entre 200 ms e 900 ms. No waterfall, o tempo injetado aparece
  # separado do tempo do upstream.
  - name: charge-lookup-slow
    match:
      pathRegex: ^/payments/charges/[^/]+$
      method: GET
    latency:
      min: 200ms
      max: 900ms

  # Desligado de propósito: ligue pelo painel ou pela API para ver o
  # serviço inteiro "em manutenção".
  - name: maintenance
    enabled: false
    match:
      path: /payments/*
    respond:
      status: 503
      headers:
        Content-Type: application/json
      body:
        error: maintenance
