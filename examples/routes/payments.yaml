# Route for the toy payment service (examples/toys/payments).
# /payments/* reaches the upstream without the prefix: /payments/balance
# becomes /balance. Overrides match the path as the client sent it, before
# the prefix is stripped.
schemaVersion: 1
name: payments
upstream: http://127.0.0.1:9001
match:
  path: /payments/*
stripPrefix: true
rewriteHost: true
timeout: 5s
overrides:
  # Forced override: with no probability, it applies to every matching
  # request. Only requests carrying X-Scenario: declined are caught; the
  # rest go on to the upstream.
  - name: charge-declined
    match:
      path: /payments/charges
      method: POST
      headers:
        X-Scenario: declined
    respond:
      status: 402
      headers:
        Content-Type: application/json
      body:
        error: card_declined
        message: Card declined by the issuer

  # Probabilistic override: 30% of the balance lookups get a synthesized 503.
  # With a fixed seed in gateway.json, the sequence repeats for the same
  # arrival order.
  - name: balance-flaky
    match:
      path: /payments/balance
      method: GET
    probability: 0.3
    respond:
      status: 503
      headers:
        Content-Type: application/json
        Retry-After: "1"
      body:
        error: balance_unavailable

  # Latency range: the charge lookup still reaches the upstream, but waits
  # between 200 ms and 900 ms first. In the waterfall, the injected time shows
  # up separately from the upstream time.
  - name: charge-lookup-slow
    match:
      pathRegex: ^/payments/charges/[^/]+$
      method: GET
    latency:
      min: 200ms
      max: 900ms

  # Disabled on purpose: turn it on from the panel or the API to see the whole
  # service "under maintenance".
  - name: maintenance
    enabled: false
    match:
      path: /payments/*
    respond:
      status: 503
      headers:
        Content-Type: application/json
      body:
        error: maintenance
