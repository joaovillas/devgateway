# Route for the toy catalog (examples/toys/catalog), passthrough only.
# No overrides declared: with learning.enabled in gateway.json, every new
# method and path answered by the upstream is written here as a disabled
# override carrying the observed response. Writing rewrites the file and drops
# these comments, which is why run.sh works on a copy in examples/.run/.
schemaVersion: 1
name: catalog
upstream: http://127.0.0.1:9002
match:
  path: /catalog/*
stripPrefix: true
rewriteHost: true
timeout: 3s
