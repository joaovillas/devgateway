schemaVersion: 1
name: payments
upstream: http://localhost:9001
match:
  host: payments.local
  path: /api/payments/*
stripPrefix: true
rewriteHost: true
timeout: 5s
overrides:
  - name: bilulu
    match:
      path: /api/payments/bilulu
      method: POST
      headers:
        X-Tenant: acme
        X-Trace:
          regex: ^t-[0-9]+$
      query:
        debug:
          contains: "1"
      body:
        json:
          a: 1
          b: [x, y]
    respond:
      status: 201
      headers:
        X-Source: override
      body:
        ok: true
        items: [1, 2]
    probability: 0.3
    latency: 2s
    drop: true
    ttl: 30s
    maxApplications: 5
  - name: slow-charges
    match:
      pathRegex: ^/api/payments/charge/[0-9]+$
    latency:
      min: 100ms
      max: 500ms
  - name: text
    match:
      path: /api/payments/text
    respond:
      body: plain text
  - name: learned-get
    enabled: false
    match:
      path: /api/payments/status
      method: GET
    respond:
      status: 200
      body: '{"status":"ok"}'
    source:
      kind: learned
      exchange: 01J8ZK3Q4N6V7W8X9Y0Z1A2B3C
      at: 2026-09-18T10:15:30.123456789Z
      bodyIncomplete: true
  - name: derived-charge
    enabled: true
    match:
      path: /api/payments/derived
    respond:
      status: 202
    source:
      kind: derived
      exchange: 01J8ZK3Q4N6V7W8X9Y0Z1A2B3D
      at: 2026-09-18T07:15:30-03:00
